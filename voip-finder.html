<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VOIP Finder</title>
  <!-- VOIP Finder · หัวข้อใหญ่ · พื้นที่ / หน่วยงาน · VOIP -->
  <style>html,body{margin:0;min-height:100%;background:#060a0f;color:#eaf7fb;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;color:#78909d}</style>
</head>
<body data-theme="gold"><div class="boot">LOADING VOIP FINDER…</div>
<script>
(async()=>{
  try{
    const parts=[
      'assets/voip-finder-payload-01.txt','assets/voip-finder-payload-02.txt','assets/voip-finder-payload-03.txt','assets/voip-finder-payload-04.txt',
      'assets/voip-finder-payload-05.txt','assets/voip-finder-payload-06.txt','assets/voip-finder-payload-07.txt','assets/voip-finder-payload-08.txt'
    ];
    const payload=(await Promise.all(parts.map(async path=>{const r=await fetch(path,{cache:'force-cache'});if(!r.ok)throw new Error('Payload '+path+' '+r.status);return (await r.text()).trim()}))).join('');
    const binary=atob(payload);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();

    const bridgeStyle=`<style id="missionVoipTheme">
      /* responsive-fit-v1 */
      html,body{min-height:100%!important;height:auto!important;overflow-y:auto!important;overflow-x:hidden!important;max-width:100%!important}
      body{width:100%!important;max-width:100%!important}
      *,*::before,*::after{box-sizing:border-box}
      img,svg,canvas,video,table{max-width:100%!important}
      input,select,textarea,button{max-width:100%!important}
      pre{max-width:100%;overflow:auto}
      @media(max-width:767px){body{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}}
      body[data-theme="gold"]{--bg:#010204;--panel:#070a0f;--panel2:#0a0e15;--line:rgba(245,197,66,.20);--text:#fff;--muted:#89909b;--cyan:#f5c542;--yellow:#ffe38a;--green:#22c55e;--shadow:0 20px 55px rgba(0,0,0,.46);--accent:#f5c542;--accentRgb:245,197,66}
      body[data-theme="cyber"]{--bg:#020716;--panel:#071427;--panel2:#091b32;--line:rgba(34,211,238,.20);--text:#f8fbff;--muted:#91a6c7;--cyan:#22d3ee;--yellow:#8cecff;--green:#2dd4bf;--shadow:0 20px 55px rgba(0,4,16,.5);--accent:#22d3ee;--accentRgb:34,211,238}
      /* unified-finder-theme-v1 */
      html,body{background:radial-gradient(circle at 8% 0%,rgba(var(--accentRgb),.09),transparent 30%),radial-gradient(circle at 92% 6%,rgba(34,211,238,.05),transparent 28%),#020508!important;color:#f2f8fb!important}
      body{background-attachment:fixed!important}
      body::-webkit-scrollbar{width:10px;height:10px}body::-webkit-scrollbar-track{background:#020508}body::-webkit-scrollbar-thumb{border:2px solid #020508;border-radius:999px;background:rgba(var(--accentRgb),.34)}
      header,.header,.topbar,.hero,.toolbar{border-color:rgba(var(--accentRgb),.22)!important;background:linear-gradient(110deg,rgba(var(--accentRgb),.11),rgba(3,8,14,.95) 40%,rgba(2,5,10,.98))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 46px rgba(0,0,0,.24)!important}
      .panel,.card,.result-card,.result-item,.search-panel,.summary-card,.voip-card,.site-card,.table-wrap{border-color:rgba(var(--accentRgb),.22)!important;border-radius:16px!important;background:linear-gradient(145deg,rgba(var(--accentRgb),.065),rgba(4,9,15,.94) 42%,rgba(2,6,11,.98))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 34px rgba(0,0,0,.22)!important}
      input,textarea,select{border-color:rgba(var(--accentRgb),.30)!important;border-radius:11px!important;background:rgba(2,7,12,.90)!important;color:#f1f9fc!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important}
      input:focus,textarea:focus,select:focus{border-color:rgba(var(--accentRgb),.74)!important;box-shadow:0 0 0 3px rgba(var(--accentRgb),.07),0 0 24px rgba(var(--accentRgb),.08)!important;outline:none!important}
      button,.btn,.copy-btn,.action-btn,.chip{border-radius:10px!important;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease!important}
      button:hover,.btn:hover,.copy-btn:hover,.action-btn:hover,.chip:hover{transform:translateY(-1px);box-shadow:0 0 20px rgba(var(--accentRgb),.12)!important}
      .chip,.badge,.pill,.tag{border-color:rgba(var(--accentRgb),.26)!important;background:rgba(var(--accentRgb),.075)!important}
      table{border-collapse:separate!important;border-spacing:0 5px!important}th{color:var(--accent)!important}td{background:rgba(3,8,14,.60)!important;border-top:1px solid rgba(var(--accentRgb),.10)!important;border-bottom:1px solid rgba(var(--accentRgb),.10)!important}
      @media(max-width:760px){.panel,.card,.result-card,.result-item,.search-panel,.voip-card,.site-card{border-radius:13px!important}}
    </style>`;

    const bridgeScript=`<script id="missionVoipBridge">(()=>{const applyTheme=theme=>{document.body.dataset.theme=theme==='cyber'?'cyber':'gold'};applyTheme(localStorage.getItem('missionTheme')||'gold');window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.type==='dhcp-theme')applyTheme(event.data.theme)});window.addEventListener('storage',event=>{if(event.key==='missionTheme')applyTheme(event.newValue||'gold')});window.parent?.postMessage({type:'voip-ready'},location.origin)})();<\/script>`;

    html=html.replace(/<body([^>]*)>/i,'<body$1 data-theme="gold">')
      .replace('</head>',bridgeStyle+'</head>')
      .replace('</body>',bridgeScript+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">VOIP FINDER COULD NOT START</div>';
    console.error(error);
  }
})();
</script></body></html>
