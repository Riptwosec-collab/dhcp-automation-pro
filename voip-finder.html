<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VOIP Finder</title>
  <style>html,body{margin:0;min-height:100%;background:#060a0f;color:#eaf7fb;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;color:#78909d}</style>
</head>
<body><div class="boot">LOADING VOIP FINDER…</div>
<script>
(async()=>{try{
  const parts=[
    'assets/voip-finder-payload-01.txt',
    'assets/voip-finder-payload-02.txt',
    'assets/voip-finder-payload-03.txt',
    'assets/voip-finder-payload-04.txt'
  ];
  const payload=(await Promise.all(parts.map(async path=>{
    const r=await fetch(path,{cache:'force-cache'});
    if(!r.ok) throw new Error('Payload '+path+' '+r.status);
    return (await r.text()).replace(/\s+/g,'');
  }))).join('');
  const binary=atob(payload);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
}catch(error){
  document.body.innerHTML='<div class="boot">VOIP FINDER COULD NOT START</div>';
  console.error(error);
}})();
</script></body></html>
