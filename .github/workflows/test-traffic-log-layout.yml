name: Test Traffic Log Layout

on:
  push:
    branches:
      - fix/format3-line-breaks
  pull_request:
    paths:
      - '.github/workflows/test-traffic-log-layout.yml'
      - '.github/workflows/resize-dhcp-fields.yml'
      - 'index.html'
      - 'uih.html'
      - 'system-owner-finder.html'
      - 'tor-system-finder-core.js'
      - 'assets/system-owner-finder-payload-*.txt'
      - 'voip-finder.html'
      - 'assets/voip-finder-payload-*.txt'
      - 'operations-messages.html'
      - 'local-ip-reputation.js'
      - 'api/ip-reputation.js'
      - 'scripts/patch-traffic-log.py'
      - 'scripts/fit-uih-viewport.py'
      - 'scripts/add-thai-down-since.py'
      - 'scripts/fullscreen-bilingual-uih.py'
      - 'scripts/add-downsince-language-toggle.py'
      - 'scripts/add-traffic-ip-reputation.py'
      - 'scripts/add-system-owner-finder.py'
      - 'scripts/add-tor-system-finder-upgrade.py'
      - 'scripts/add-responsive-fit.py'
      - 'scripts/add-business-hours.py'
      - 'scripts/add-operations-visual-refresh.py'
      - 'scripts/inspect-tor-payload.py'
      - 'scripts/test-traffic-log-layout.py'
      - 'scripts/test-downsince-bilingual.js'
      - 'scripts/test-ip-reputation.py'
      - 'scripts/test-ip-reputation-api.js'
      - 'scripts/test-local-ip-reputation.js'
      - 'scripts/test-system-owner-finder.py'
      - 'scripts/test-tor-system-finder-core.js'
      - 'scripts/test-tor-system-finder-owner-core.js'
      - 'scripts/test-tor-system-finder-upgrade.py'
      - 'scripts/test-responsive-fit.py'
      - 'scripts/test-business-hours.js'
      - 'scripts/test-operations-visual-refresh.js'

jobs:
  test-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply traffic log layout patch in test workspace when missing
        run: |
          if grep -q 'traffic-log-layout-v3' index.html && grep -q 'id="view-uih"' index.html; then
            echo 'Traffic/UIh layout already materialized'
          else
            python scripts/patch-traffic-log.py
          fi
      - name: Add traffic IP reputation panel when missing
        run: |
          if grep -q 'id="ipReputationPanel"' index.html; then
            echo 'IP reputation panel already generated'
          else
            python scripts/add-traffic-ip-reputation.py
          fi
      - name: Add topbar System Owner and VOIP tools
        run: python scripts/add-system-owner-finder.py
      - name: Apply TOR System Finder runtime bridge
        run: python scripts/add-tor-system-finder-upgrade.py
      - name: Fit UIh to the available viewport when missing
        run: |
          if grep -q 'uih-fit-viewport-v1' uih.html; then
            echo 'UIh viewport layer already materialized'
          else
            python scripts/fit-uih-viewport.py
          fi
      - name: Localize UIh Down Since in Thai when missing
        run: |
          if grep -q 'thai-down-since-v2' uih.html; then
            echo 'UIh Down Since localization already materialized'
          else
            python scripts/add-thai-down-since.py
          fi
      - name: Make Generate Log UIh fullscreen and bilingual when missing
        run: |
          if grep -q 'uih-fullscreen-bilingual-v1' uih.html; then
            echo 'UIh fullscreen bilingual layer already materialized'
          else
            python scripts/fullscreen-bilingual-uih.py
          fi
      - name: Add independent Down Since language toggle when missing
        run: |
          if grep -q 'uih-down-since-language-v1' uih.html; then
            echo 'UIh Down Since language toggle already materialized'
          else
            python scripts/add-downsince-language-toggle.py
          fi
      - name: Apply Responsive Fit v1
        run: python scripts/add-responsive-fit.py
      - name: Apply Business Hours v1
        run: python scripts/add-business-hours.py
      - name: Apply Operations Visual Refresh v2
        run: python scripts/add-operations-visual-refresh.py
      - name: Verify traffic log and UIh layout
        run: python scripts/test-traffic-log-layout.py
      - name: Verify bilingual Down Since behavior
        run: node scripts/test-downsince-bilingual.js
      - name: Verify local traffic IP reputation panel
        run: python scripts/test-ip-reputation.py
      - name: Verify local IP reputation behavior
        run: node scripts/test-local-ip-reputation.js
      - name: Verify optional legacy IP reputation API behavior
        run: node scripts/test-ip-reputation-api.js
      - name: Verify System Owner and VOIP integration
        run: python scripts/test-system-owner-finder.py
      - name: Inspect canonical TOR payload
        run: python scripts/inspect-tor-payload.py
      - name: Verify TOR System Finder core parser
        run: node scripts/test-tor-system-finder-core.js
      - name: Verify TOR System Finder owner normalization
        run: node scripts/test-tor-system-finder-owner-core.js
      - name: Verify TOR System Finder canonical bridge
        run: python scripts/test-tor-system-finder-upgrade.py
      - name: Verify adaptive responsive fit
        run: python scripts/test-responsive-fit.py
      - name: Verify Business Hours v1
        run: node scripts/test-business-hours.js
      - name: Verify Operations Visual Refresh v2
        run: node scripts/test-operations-visual-refresh.js
