name: Test Traffic Log Layout

on:
  push:
    branches:
      - fix/format3-line-breaks
  pull_request:
    paths:
      - 'index.html'
      - 'uih.html'
      - 'scripts/patch-traffic-log.py'
      - 'scripts/fit-uih-viewport.py'
      - 'scripts/add-thai-down-since.py'
      - 'scripts/test-traffic-log-layout.py'

jobs:
  test-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply traffic log layout patch in test workspace
        run: python scripts/patch-traffic-log.py
      - name: Fit UIh to the available viewport
        run: python scripts/fit-uih-viewport.py
      - name: Localize UIh Down Since in Thai
        run: python scripts/add-thai-down-since.py
      - name: Verify traffic log and UIh layout
        run: python scripts/test-traffic-log-layout.py
