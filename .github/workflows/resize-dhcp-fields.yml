name: Apply Layout A and Premium Themes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove sidebar, move brand, resize fields, deepen themes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- layout-a-no-sidebar-v2 -->'

          # Remove the full desktop sidebar (Layout A).
          text, removed = re.subn(
              r'\n\s*<aside class="desktop-sidebar[\s\S]*?</aside>\n',
              '\n',
              text,
              count=1,
          )

          # Move the product identity into the open area of the top bar,
          # immediately before the theme selector.
          brand = '''
        <div class="brand-block hidden lg:flex items-center gap-3 ml-auto mr-1 shrink-0" aria-label="DHCP Mission Control">
          <div class="brand-mark"><i data-lucide="orbit" class="w-5 h-5"></i><span class="brand-dot"></span></div>
          <div class="brand-copy">
            <div class="brand-kicker"><span class="brand-status"></span>IP AUTOMATION SUITE</div>
            <div class="brand-title">DHCP <span>MISSION CONTROL</span></div>
          </div>
        </div>'''
          if 'class="brand-block' not in text:
              needle = '        </nav>\n        <div class="theme-toggle"'
              if needle not in text:
                  raise SystemExit('Topbar insertion point not found; refusing unrelated edit.')
              text = text.replace(needle, '        </nav>' + brand + '\n        <div class="theme-toggle"', 1)

          # Give the reclaimed sidebar space back to the workspace.
          text = text.replace('max-w-[1380px]', 'max-w-[1640px]', 1)

          # Device stays compact. DNS is only wide enough for the default text value,
          # rather than expanding across the row.
          old_grids = [
              'xl:grid-cols-[150px_minmax(320px,1.8fr)_minmax(155px,1fr)_minmax(155px,1fr)_80px_110px]',
              'xl:grid-cols-6',
          ]
          new_grid = 'xl:grid-cols-[150px_250px_minmax(165px,1fr)_minmax(165px,1fr)_84px_112px]'
          for old in old_grids:
              if old in text:
                  text = text.replace(old, new_grid, 1)
                  break

          # Add the visual upgrade as a late CSS override so existing features and IDs stay intact.
          css = r'''
    /* layout-a-no-sidebar-v2 */
    :root{
      --bg:#010204;
      --bg2:#05070b;
      --panel:rgba(7,10,15,.88);
      --panel-2:rgba(10,14,21,.92);
      --input:rgba(1,4,9,.82);
      --border:rgba(255,255,255,.085);
      --border-strong:rgba(245,197,66,.62);
      --accent:#f5c542;
      --accent-2:#ffe38a;
      --accent-dark:#c88800;
      --accent-rgb:245,197,66;
      --glow:rgba(245,197,66,.38);
      --muted:#89909b;
    }
    body[data-theme="cyber"]{
      --bg:#020716;
      --bg2:#061027;
      --panel:rgba(7,20,39,.90);
      --panel-2:rgba(9,27,50,.94);
      --input:rgba(3,10,24,.88);
      --border:rgba(106,166,255,.16);
      --border-strong:rgba(34,211,238,.68);
      --accent:#22d3ee;
      --accent-2:#8cecff;
      --accent-dark:#087dc1;
      --accent-rgb:34,211,238;
      --glow:rgba(34,211,238,.38);
      --muted:#91a6c7;
      --success:#2dd4bf;
      --info:#60a5fa;
    }
    .main-workspace{width:100%;min-width:0}
    .workspace-shell{max-width:1640px!important}
    .topbar{
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(8,11,17,.97),rgba(7,10,16,.93))!important;
      box-shadow:0 12px 38px rgba(0,0,0,.52),inset 0 -1px 0 rgba(var(--accent-rgb),.08);
    }
    body[data-theme="cyber"] .topbar{
      background:linear-gradient(180deg,rgba(7,18,35,.97),rgba(7,15,31,.94))!important;
      box-shadow:0 12px 40px rgba(0,5,18,.64),inset 0 -1px 0 rgba(34,211,238,.13);
    }
    .topbar::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(110deg,transparent 18%,rgba(var(--accent-rgb),.06) 42%,rgba(var(--accent-rgb),.12) 50%,rgba(var(--accent-rgb),.06) 58%,transparent 82%);
      transform:translateX(-120%);animation:headerSweep 8s ease-in-out infinite;
    }
    .brand-block{position:relative;z-index:2;padding:5px 14px 5px 4px}
    .brand-mark{
      position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
      color:var(--accent);border:1px solid var(--border-strong);background:rgba(var(--accent-rgb),.11);
      box-shadow:0 0 18px rgba(var(--accent-rgb),.20),inset 0 0 16px rgba(var(--accent-rgb),.08);
      animation:brandFloat 3.8s ease-in-out infinite;
    }
    .brand-mark::before{content:"";position:absolute;inset:-5px;border-radius:15px;border:1px solid rgba(var(--accent-rgb),.12);animation:brandOrbit 6s linear infinite}
    .brand-dot{position:absolute;right:-2px;top:-2px;width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:statusPulse 1.8s ease-in-out infinite}
    .brand-copy{line-height:1.05;min-width:210px}
    .brand-kicker{font:700 9px/1.1 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .brand-status{width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
    .brand-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:#fff;white-space:nowrap}
    .brand-title span{color:var(--accent);text-shadow:0 0 16px rgba(var(--accent-rgb),.42)}
    .glass-panel{
      background:linear-gradient(145deg,var(--panel),rgba(6,9,14,.76))!important;
      border-color:var(--border)!important;
      box-shadow:0 20px 52px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(var(--accent-rgb),.018);
      position:relative;
    }
    body[data-theme="cyber"] .glass-panel{background:linear-gradient(145deg,var(--panel),rgba(5,15,32,.83))!important;box-shadow:0 22px 58px rgba(0,4,16,.58),inset 0 1px 0 rgba(150,210,255,.04),0 0 32px rgba(34,211,238,.035)}
    .glass-panel::after{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.022) 42%,rgba(var(--accent-rgb),.055) 50%,rgba(255,255,255,.018) 58%,transparent 85%);
      transform:translateX(-130%);animation:panelSweep 11s ease-in-out infinite;
    }
    .cyber-input{background:var(--input)!important;border-color:rgba(var(--accent-rgb),.13)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.48),0 0 0 1px rgba(255,255,255,.018)}
    .cyber-input:hover{border-color:rgba(var(--accent-rgb),.34)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 14px rgba(var(--accent-rgb),.07)}
    .cyber-input:focus{border-color:var(--accent)!important;box-shadow:0 0 0 1px rgba(var(--accent-rgb),.20),0 0 24px rgba(var(--accent-rgb),.20),inset 0 0 12px rgba(var(--accent-rgb),.05)}
    .btn-glow::before{content:"";position:absolute;top:-80%;left:-35%;width:28%;height:260%;transform:rotate(22deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:buttonSweep 5.5s ease-in-out infinite;pointer-events:none}
    .theme-toggle{position:relative;z-index:2;background:rgba(0,0,0,.24);border-color:rgba(var(--accent-rgb),.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 22px rgba(var(--accent-rgb),.05)}
    .theme-choice{position:relative;overflow:hidden}
    .theme-choice.active{background:linear-gradient(135deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.09));color:var(--accent);box-shadow:0 0 22px rgba(var(--accent-rgb),.24),inset 0 0 12px rgba(var(--accent-rgb),.08);text-shadow:0 0 10px rgba(var(--accent-rgb),.38)}
    .tab-btn{position:relative;transition:color .25s ease,background .25s ease,transform .25s ease}
    .tab-btn:hover{background:rgba(var(--accent-rgb),.045);transform:translateY(-1px)}
    .tab-btn::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transition:transform .28s ease;box-shadow:0 0 12px var(--accent)}
    .tab-btn:hover::after,.tab-btn.accent-text::after{transform:scaleX(1)}
    .ambient-light{animation:ambientBreath 8s ease-in-out infinite alternate}
    .bg-grid{opacity:.82;animation:panBg 80s linear infinite,gridPulse 6s ease-in-out infinite}
    .terminal-container{box-shadow:inset 0 0 42px rgba(var(--accent-rgb),.025),0 18px 46px rgba(0,0,0,.42)}
    .terminal-container::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(var(--accent-rgb),.055),transparent 55%);animation:terminalGlow 4s ease-in-out infinite}
    @keyframes headerSweep{0%,12%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
    @keyframes panelSweep{0%,22%{transform:translateX(-130%)}62%,100%{transform:translateX(130%)}}
    @keyframes buttonSweep{0%,34%{left:-35%;opacity:0}46%{opacity:1}62%,100%{left:125%;opacity:0}}
    @keyframes brandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes brandOrbit{0%{transform:rotate(0deg);opacity:.35}50%{opacity:.8}100%{transform:rotate(360deg);opacity:.35}}
    @keyframes statusPulse{0%,100%{transform:scale(.75);opacity:.65}50%{transform:scale(1.25);opacity:1}}
    @keyframes ambientBreath{0%{filter:saturate(.95) brightness(.92)}100%{filter:saturate(1.18) brightness(1.08)}}
    @keyframes gridPulse{0%,100%{opacity:.52}50%{opacity:.86}}
    @keyframes terminalGlow{0%,100%{opacity:.35}50%{opacity:1}}
    @media(max-width:1180px){.brand-copy{min-width:180px}.brand-title{font-size:12px}.brand-kicker{font-size:8px}}
'''
          if '/* layout-a-no-sidebar-v2 */' not in text:
              text = text.replace('  </style>', css + '  </style>', 1)

          if marker not in text:
              text = text.replace('<body data-theme="gold" class="font-sans">', '<body data-theme="gold" class="font-sans">\n  ' + marker, 1)

          path.write_text(text, encoding='utf-8')
          print(f'patched sidebar_removed={removed}; bytes={len(text)}')
          PY
      - name: Commit Layout A
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: remove sidebar and intensify gold cyber themes'
          git push origin HEAD:main
