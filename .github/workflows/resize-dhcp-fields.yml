name: Link Scroll Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  patch-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Link scroll stylesheet
        shell: bash
        run: |
          if grep -q 'scroll-fix.css' index.html; then
            echo 'scroll-fix.css already linked'
          else
            sed -i 's#</head>#  <link rel="stylesheet" href="scroll-fix.css">\n</head>#' index.html
          fi

      - name: Commit scroll fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enable full vertical scrolling for log page'
          git push origin HEAD:main
