name: Add Format 3 Masked Log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  patch-format-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Format 3 and reorder outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'format-3-wide-mask-v1'

          if marker in text:
              print('Format 3 already present')
              raise SystemExit(0)

          old_results = '''<div class="space-y-6"><div id="logRes1" class="glass-panel p-4 rounded-xl"><div class="flex justify-between items-center mb-3"><label class="text-sm font-semibold accent-text">FORMAT 1: Full IP</label><button onclick="copyLogText('result1',this)" class="copy-mini text-xs font-bold">COPY</button></div><textarea id="result1" rows="3" class="cyber-input w-full rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea></div><div id="logRes2" class="glass-panel p-4 rounded-xl"><div class="flex justify-between items-center mb-3"><label class="text-sm font-semibold accent-text">FORMAT 2: Masked IP (xx)</label><button onclick="copyLogText('result2',this)" class="copy-mini text-xs font-bold">COPY</button></div><textarea id="result2" rows="3" class="cyber-input w-full rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea></div></div>'''
          new_results = '''<div class="space-y-6"><div id="logRes3" class="glass-panel p-4 rounded-xl"><div class="flex justify-between items-center mb-3"><label class="text-sm font-semibold accent-text">FORMAT 3: Masked IP (10.x.x.x)</label><button onclick="copyLogText('result3',this)" class="copy-mini text-xs font-bold">COPY</button></div><textarea id="result3" rows="3" class="cyber-input w-full rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea></div><div id="logRes2" class="glass-panel p-4 rounded-xl"><div class="flex justify-between items-center mb-3"><label class="text-sm font-semibold accent-text">FORMAT 2: Masked IP (xx)</label><button onclick="copyLogText('result2',this)" class="copy-mini text-xs font-bold">COPY</button></div><textarea id="result2" rows="3" class="cyber-input w-full rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea></div><div id="logRes1" class="glass-panel p-4 rounded-xl"><div class="flex justify-between items-center mb-3"><label class="text-sm font-semibold accent-text">FORMAT 1: Full IP</label><button onclick="copyLogText('result1',this)" class="copy-mini text-xs font-bold">COPY</button></div><textarea id="result1" rows="3" class="cyber-input w-full rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea></div></div>'''
          if old_results not in text:
              raise SystemExit('Log result cards not found; refusing unrelated edit.')
          text = text.replace(old_results, new_results, 1)

          mask_fn = "function maskIp(ip){const e=extractIPv4(ip);if(!e)return ip||'';const p=e.split('.');p[3]='xx';return p.join('.')}"
          if mask_fn not in text:
              raise SystemExit('maskIp function not found; refusing unrelated edit.')
          text = text.replace(mask_fn, mask_fn + "\n  function maskIpWide(ip){const e=extractIPv4(ip);if(!e)return ip||'';const p=e.split('.');return `${p[0]}.x.x.x`}", 1)

          pattern = re.compile(r"  function generateLogs\(\)\{.*?triggerFlash\('logRes2'\)\}")
          match = pattern.search(text)
          if not match:
              raise SystemExit('generateLogs function not found; refusing unrelated edit.')
          new_generate = """  function generateLogs(){const time=document.getElementById('timeInput').value.trim()||'00',src=document.getElementById('srcIp').value.trim()||'-',dst=document.getElementById('dstIp').value.trim()||'-',isp=document.getElementById('ispInput').value.trim()||'PRIVATE';document.getElementById('result3').value=`เวลา ${time} น. ตรวจสอบพบต้นทาง IP : ${maskIpWide(src)} เรียกไปปลายทาง IP : ${maskIpWide(dst)} ( ${isp} )\\nไม่ Block การใช้งานเนื่องจากตรวจสอบแล้วเป็นการใช้งานตามปกติ`;document.getElementById('result2').value=`เวลา ${time} น. ตรวจสอบพบต้นทาง IP : ${maskIp(src)} เรียกไปปลายทาง IP : ${maskIp(dst)} ( ${isp} )\\nไม่ Block การใช้งานเนื่องจากตรวจสอบแล้วเป็นการใช้งานตามปกติ`;document.getElementById('result1').value=`เวลา ${time} น. ตรวจสอบพบต้นทาง IP : ${src} เรียกไปปลายทาง IP : ${dst} ( ${isp} )\\nไม่ Block การใช้งานเนื่องจากตรวจสอบแล้วเป็นการใช้งานตามปกติ`;triggerFlash('logRes3');triggerFlash('logRes2');triggerFlash('logRes1')}"""
          text = text[:match.start()] + new_generate + text[match.end():]

          text = text.replace('  </style>', '''\n    /* format-3-wide-mask-v1 */\n    #logRes3{border-color:rgba(var(--accentRgb),.32)!important;box-shadow:0 0 24px rgba(var(--accentRgb),.07),0 16px 36px rgba(0,0,0,.30)}\n    #logRes3 .accent-text{text-shadow:0 0 12px rgba(var(--accentRgb),.30)}\n  </style>''', 1)

          path.write_text(text, encoding='utf-8')
          print('Added Format 3 (first octet only mask) and reordered cards 3 > 2 > 1')
          PY

      - name: Commit Format 3
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add format 3 wide masked log output'
          git push origin HEAD:main
