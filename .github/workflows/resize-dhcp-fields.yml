name: Rename Log Generator Tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  rename-log-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename System Log Generator navigation tab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'System Log Generator</button>'
          new = 'Generate Log traffic</button>'

          if new in text:
              print('Navigation tab already renamed')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Renamed navigation tab to Generate Log traffic')
          else:
              raise SystemExit('Target navigation label not found; refusing unrelated edit.')
          PY

      - name: Commit navigation rename
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: rename log generator navigation tab'
          git push origin HEAD:main
