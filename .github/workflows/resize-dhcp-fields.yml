name: Rename Log Generator Heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  rename-log-heading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename System Log Generator heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<h1 class="text-2xl font-bold tracking-wide">SYSTEM LOG GENERATOR</h1>'
          new = '<h1 class="text-2xl font-bold tracking-wide">Generate Log traffic</h1>'

          if new in text:
              print('Heading already renamed')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Renamed heading to Generate Log traffic')
          else:
              raise SystemExit('Target heading not found; refusing unrelated edit.')
          PY

      - name: Commit heading rename
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: rename log generator heading'
          git push origin HEAD:main
