name: Upgrade Traffic Log and UIh Generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'
      - 'tor-system-finder.html'
      - 'assets/tor-system-data-1.js'
      - 'assets/tor-system-matcher.js'
      - 'local-ip-reputation.js'
      - 'api/ip-reputation.js'
      - 'scripts/patch-traffic-log.py'
      - 'scripts/add-traffic-ip-reputation.py'
      - 'scripts/add-system-owner-finder.py'
      - 'scripts/fit-uih-viewport.py'
      - 'scripts/add-thai-down-since.py'
      - 'scripts/fullscreen-bilingual-uih.py'
      - 'scripts/add-downsince-language-toggle.py'
      - 'scripts/test-traffic-log-layout.py'
      - 'scripts/test-downsince-bilingual.js'
      - 'scripts/test-ip-reputation.py'
      - 'scripts/test-ip-reputation-api.js'
      - 'scripts/test-local-ip-reputation.js'
      - 'scripts/test-system-owner-finder.py'
      - 'scripts/test-system-owner-finder.js'

permissions:
  contents: write

jobs:
  patch-traffic-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Generate Log traffic and UIh pages
        run: python scripts/patch-traffic-log.py

      - name: Add local traffic IP reputation analysis
        run: python scripts/add-traffic-ip-reputation.py

      - name: Add System Owner Finder to Generate Log traffic
        run: python scripts/add-system-owner-finder.py

      - name: Fit Generate Log UIh to viewport
        run: python scripts/fit-uih-viewport.py

      - name: Localize Generate Log UIh Down Since
        run: python scripts/add-thai-down-since.py

      - name: Make Generate Log UIh fullscreen and bilingual
        run: python scripts/fullscreen-bilingual-uih.py

      - name: Add independent Down Since language toggle
        run: python scripts/add-downsince-language-toggle.py

      - name: Verify traffic log and UIh integration
        run: python scripts/test-traffic-log-layout.py

      - name: Verify bilingual Down Since behavior
        run: node scripts/test-downsince-bilingual.js

      - name: Verify local traffic IP reputation panel
        run: python scripts/test-ip-reputation.py

      - name: Verify local IP reputation behavior
        run: node scripts/test-local-ip-reputation.js

      - name: Verify optional legacy IP reputation API behavior
        run: node scripts/test-ip-reputation-api.js

      - name: Verify System Owner Finder integration
        run: python scripts/test-system-owner-finder.py

      - name: Verify TOR System Owner matching behavior
        run: node scripts/test-system-owner-finder.js

      - name: Commit generated page changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html uih.html
          git diff --cached --quiet && exit 0
          git commit -m 'ui: add System Owner Finder to traffic log'
          git push origin HEAD:main
