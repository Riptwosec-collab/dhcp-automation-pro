name: Upgrade Traffic Log Generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'
      - 'scripts/patch-traffic-log.py'
      - 'scripts/test-traffic-log-layout.py'

permissions:
  contents: write

jobs:
  patch-traffic-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Generate Log traffic page
        run: python scripts/patch-traffic-log.py

      - name: Verify widened log layout
        run: python scripts/test-traffic-log-layout.py

      - name: Commit generated page changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'ui: widen traffic log results and notes'
          git push origin HEAD:main
