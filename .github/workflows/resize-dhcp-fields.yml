name: Add Current Time Quick Fill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-dhcp-fields.yml'

permissions:
  contents: write

jobs:
  patch-current-time-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add current time quick-fill button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'current-time-quick-fill-v1'

          if marker in text:
              print('Current time quick-fill already present')
              raise SystemExit(0)

          old = '''<div class="flex gap-3"><input id="timeInput" value="00" placeholder="เช่น 10:25" class="cyber-input w-full rounded-xl px-5 py-3.5 font-mono" onblur="autoCalculateTime()"><button onclick="document.getElementById('timeInput').value='00'" class="btn-glow px-7 rounded-xl font-bold">00</button></div>'''
          new = '''<div class="flex gap-3"><input id="timeInput" value="00" placeholder="เช่น 10:25" class="cyber-input w-full rounded-xl px-5 py-3.5 font-mono" onblur="autoCalculateTime()"><button id="btnUseCurrentTime" onclick="useCurrentTime()" class="btn-glow current-time-fill-btn px-4 md:px-5 rounded-xl font-bold flex items-center justify-center gap-2 whitespace-nowrap" title="ใส่เวลาปัจจุบันลงในช่อง"><i data-lucide="clock-3" class="w-4 h-4"></i><span id="currentTimeButtonLabel">NOW</span></button><button onclick="document.getElementById('timeInput').value='00'" class="btn-glow px-7 rounded-xl font-bold">00</button></div>'''
          if old not in text:
              raise SystemExit('Time input row not found; refusing unrelated edit.')
          text = text.replace(old, new, 1)

          old_fn = '''  function updateCurrentTimeDisplay(){
    const el=document.getElementById('currentTimeDisplay');
    if(!el)return;
    const now=new Date();
    el.textContent=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  }'''
          new_fn = '''  function updateCurrentTimeDisplay(){
    const el=document.getElementById('currentTimeDisplay');
    const btnLabel=document.getElementById('currentTimeButtonLabel');
    const now=new Date();
    const full=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const short=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if(el)el.textContent=full;
    if(btnLabel)btnLabel.textContent=short;
  }
  function useCurrentTime(){
    const now=new Date();
    const value=`${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;
    const input=document.getElementById('timeInput');
    if(!input)return;
    input.value=value;
    input.focus();
    input.select();
    const btn=document.getElementById('btnUseCurrentTime');
    if(btn){btn.classList.remove('time-fill-flash');void btn.offsetWidth;btn.classList.add('time-fill-flash')}
  }'''
          if old_fn not in text:
              raise SystemExit('Current time display function not found; refusing unrelated edit.')
          text = text.replace(old_fn, new_fn, 1)

          css = '''\n    /* current-time-quick-fill-v1 */\n    .current-time-fill-btn{min-width:104px;border-color:rgba(var(--accentRgb),.48);background:linear-gradient(135deg,rgba(var(--accentRgb),.17),rgba(var(--accentRgb),.07));box-shadow:0 0 18px rgba(var(--accentRgb),.12),inset 0 1px 0 rgba(255,255,255,.04)}\n    .current-time-fill-btn span{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:.03em}\n    .current-time-fill-btn svg{filter:drop-shadow(0 0 5px rgba(var(--accentRgb),.5))}\n    .current-time-fill-btn:hover{box-shadow:0 0 26px rgba(var(--accentRgb),.28),inset 0 0 14px rgba(var(--accentRgb),.08)}\n    .time-fill-flash{animation:timeFillFlash .55s ease-out}\n    @keyframes timeFillFlash{0%{transform:scale(.96);box-shadow:0 0 0 rgba(var(--accentRgb),0)}45%{transform:scale(1.04);box-shadow:0 0 32px rgba(var(--accentRgb),.48)}100%{transform:scale(1);box-shadow:0 0 18px rgba(var(--accentRgb),.12)}}\n    @media(max-width:520px){.current-time-fill-btn{min-width:88px;padding-left:12px!important;padding-right:12px!important}}\n'''
          text = text.replace('  </style>', css + '  </style>', 1)

          path.write_text(text, encoding='utf-8')
          print('Added live current-time quick-fill button beside 00')
          PY

      - name: Commit current time quick-fill
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add current time quick-fill button'
          git push origin HEAD:main
