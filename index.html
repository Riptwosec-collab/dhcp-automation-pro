<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHCP Automation PRO v3.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    :root{
      color-scheme:dark;
      --accent:56,189,248;
      --accent2:139,92,246;
      --panel1:rgba(15,23,42,.82);
      --panel2:rgba(2,6,23,.66);
      --bg:radial-gradient(circle at 18% 12%,rgba(56,189,248,.22),transparent 26%),radial-gradient(circle at 82% 16%,rgba(139,92,246,.18),transparent 28%),linear-gradient(135deg,#020617,#07142f 48%,#020617);
    }
    body[data-theme="network"]{
      --accent:45,212,191;
      --accent2:14,165,233;
      --panel1:rgba(6,22,35,.84);
      --panel2:rgba(3,10,22,.70);
      --bg:radial-gradient(circle at 16% 16%,rgba(45,212,191,.22),transparent 24%),radial-gradient(circle at 84% 16%,rgba(14,165,233,.22),transparent 28%),linear-gradient(135deg,#020617,#031525 36%,#06263c 72%,#02121f);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#020617;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;position:relative}
    body:before{content:"";position:fixed;inset:0;background:var(--bg);z-index:0;pointer-events:none;transition:.45s}
    .app-shell{position:relative;z-index:10}
    .terminal{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .glass-panel{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--panel1),var(--panel2))!important;border:1px solid rgba(255,255,255,.10)!important;backdrop-filter:blur(20px) saturate(135%);box-shadow:0 28px 90px rgba(0,0,0,.42),0 0 45px rgba(var(--accent),.13),inset 0 1px 0 rgba(255,255,255,.08)}
    .glass-panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent,rgba(255,255,255,.075),transparent);transform:translateX(-120%);animation:sweep 8s ease-in-out infinite}
    .pool-card{background:linear-gradient(135deg,rgba(15,23,42,.88),rgba(2,6,23,.76))!important;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.32);transition:.35s}
    .pool-card:hover{transform:translateY(-7px);box-shadow:0 30px 80px rgba(0,0,0,.44),0 0 40px rgba(var(--accent),.16)}

    .space-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;perspective:1000px}
    #bgCanvas{position:absolute;inset:0;width:100%;height:100%}
    .scene{position:absolute;inset:0;transition:.5s}
    .space-scene{opacity:1}.network-scene{opacity:0}
    body[data-theme="network"] .space-scene{opacity:0;transform:scale(1.03)}
    body[data-theme="network"] .network-scene{opacity:1}
    .nebula{position:absolute;border-radius:9999px;filter:blur(38px);opacity:.7;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
    .nbl1{width:50vw;height:50vw;left:-14vw;top:-10vw;background:radial-gradient(circle,rgba(56,189,248,.36),rgba(29,78,216,.15) 42%,transparent 70%)}
    .nbl2{width:45vw;height:45vw;right:-12vw;top:1vw;background:radial-gradient(circle,rgba(168,85,247,.32),rgba(88,28,135,.16) 45%,transparent 72%);animation-delay:-5s}
    .planet{position:absolute;border-radius:50%;right:8%;top:13%;width:220px;height:220px;background:radial-gradient(circle at 28% 25%,rgba(191,219,254,.92),rgba(59,130,246,.45) 34%,rgba(30,64,175,.22) 58%,rgba(2,6,23,.35));box-shadow:inset -42px -34px 70px rgba(0,0,0,.42),0 0 80px rgba(96,165,250,.15);animation:planet 14s ease-in-out infinite}
    .ring{position:absolute;width:320px;height:92px;right:4%;top:19%;border:1px solid rgba(224,242,254,.24);border-radius:50%;transform:rotate(-18deg) rotateX(68deg);box-shadow:0 0 40px rgba(56,189,248,.10);animation:ring 18s linear infinite}
    .grid3d,.network-grid{position:absolute;left:-10%;bottom:-22%;width:120%;height:62%;transform:perspective(900px) rotateX(70deg);transform-origin:bottom;background-image:linear-gradient(rgba(56,189,248,.20) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.20) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to top,rgba(255,255,255,.82),transparent 84%);animation:grid 7s linear infinite;opacity:.44}
    .shoot{position:absolute;width:140px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,rgba(34,211,238,.30));filter:drop-shadow(0 0 10px rgba(56,189,248,.68));transform:rotate(-28deg);opacity:0;animation:shoot 8s ease-in-out infinite}.s1{top:18%;left:18%}.s2{top:34%;left:70%;animation-delay:4s}
    .network-grid{left:-8%;bottom:-18%;width:116%;height:56%;transform:perspective(980px) rotateX(72deg);background-image:linear-gradient(rgba(45,212,191,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.22) 1px,transparent 1px);background-size:64px 64px;animation-duration:5.6s;opacity:.54}
    .network-hub{position:absolute;width:190px;height:190px;border-radius:34px;background:radial-gradient(circle at 32% 30%,rgba(165,243,252,.32),rgba(6,182,212,.12) 42%,rgba(2,6,23,.12) 72%),linear-gradient(135deg,rgba(14,165,233,.14),rgba(45,212,191,.09));border:1px solid rgba(45,212,191,.25);box-shadow:0 0 40px rgba(45,212,191,.14),inset 0 1px 0 rgba(255,255,255,.08);animation:hub 10s ease-in-out infinite}
    .hub-main{right:10%;top:18%}.hub-side{left:8%;bottom:20%;width:128px;height:128px;border-radius:26px;animation-delay:-4s}
    .signal-ring{position:absolute;border:1px solid rgba(45,212,191,.20);border-radius:9999px;animation:pulse 5.5s ease-out infinite}.r1{width:250px;height:250px;right:6.5%;top:14%}.r2{width:360px;height:360px;right:1%;top:8%;animation-delay:1.6s}.r3{width:220px;height:220px;left:4.5%;bottom:16%;animation-delay:.8s}
    .data-stream{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.86),rgba(45,212,191,.18),transparent);filter:drop-shadow(0 0 10px rgba(34,211,238,.46));opacity:.66;animation:stream 7s linear infinite}.st1{width:34vw;left:12%;top:24%;transform:rotate(18deg)}.st2{width:30vw;right:18%;bottom:24%;transform:rotate(-18deg);animation-delay:-2.4s}.st3{width:24vw;left:32%;top:54%;transform:rotate(-8deg);animation-delay:-4s}
    .floating-node{position:absolute;width:16px;height:16px;border-radius:999px;background:radial-gradient(circle,rgba(165,243,252,.88),rgba(14,165,233,.38) 58%,transparent 72%);box-shadow:0 0 16px rgba(45,212,191,.38);animation:node 9s ease-in-out infinite}.fn1{left:18%;top:22%}.fn2{left:28%;top:36%;animation-delay:-1.8s}.fn3{left:58%;top:28%;animation-delay:-3.5s}.fn4{right:20%;top:42%;animation-delay:-2s}.fn5{left:20%;bottom:26%;animation-delay:-4.2s}

    .theme-badge{display:inline-flex;gap:.5rem;align-items:center;padding:.45rem .85rem;border-radius:999px;background:rgba(var(--accent),.10);border:1px solid rgba(var(--accent),.22);color:#e0f2fe;font-size:.82rem}
    .theme-switcher{display:flex;gap:.5rem;padding:.45rem;border-radius:999px;background:rgba(2,6,23,.38);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px)}
    .theme-btn{border:0;background:transparent;color:#cbd5e1;padding:.72rem 1rem;border-radius:999px;font-weight:800;cursor:pointer;transition:.25s}
    .theme-btn.active{background:linear-gradient(135deg,rgba(var(--accent),.22),rgba(var(--accent2),.12));color:white;box-shadow:0 0 0 1px rgba(var(--accent),.22),0 8px 24px rgba(0,0,0,.22)}

    .credit-wrap{margin-top:.82rem;display:inline-flex;align-items:center;position:relative;width:auto;height:auto;padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
    .credit-glass{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:232px;padding:.78rem 1.18rem;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 44%,rgba(56,189,248,.018)),linear-gradient(135deg,rgba(12,28,58,.34),rgba(3,10,28,.20));border:1px solid rgba(178,221,255,.24);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -14px 28px rgba(4,12,30,.24),inset 0 0 22px rgba(125,211,252,.045),0 0 0 1px rgba(56,189,248,.055),0 12px 26px rgba(0,0,0,.12),0 0 26px rgba(56,189,248,.055);overflow:hidden}
    .credit-glass:before{content:"";position:absolute;inset:2px;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.035) 32%,transparent 72%);opacity:.72;pointer-events:none}
    .credit-glass:after{content:"";position:absolute;top:-10%;left:-38%;width:45%;height:120%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),rgba(255,255,255,.035),transparent);transform:skewX(-20deg);opacity:.46;animation:creditShine 8s ease-in-out infinite;pointer-events:none}
    .credit-glass .layer{position:absolute;inset:7px;border-radius:inherit;border:1px solid rgba(255,255,255,.075);box-shadow:inset 0 0 18px rgba(125,211,252,.032);opacity:.82;pointer-events:none}
    .credit-glass .layer.two{inset:13px;border-color:rgba(255,255,255,.045);opacity:.42;filter:blur(.2px)}
    .credit-text{position:relative;z-index:2;font-size:.82rem;font-weight:650;letter-spacing:.1px;color:rgba(222,241,255,.50);text-shadow:0 1px 8px rgba(155,213,255,.11),0 -1px 0 rgba(255,255,255,.04);white-space:nowrap}
    body[data-theme="network"] .credit-glass{background:linear-gradient(135deg,rgba(255,255,255,.052),rgba(255,255,255,.011) 44%,rgba(45,212,191,.018)),linear-gradient(135deg,rgba(4,28,38,.35),rgba(3,12,22,.22));border-color:rgba(185,255,244,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -14px 28px rgba(3,10,22,.24),inset 0 0 22px rgba(45,212,191,.038),0 0 0 1px rgba(45,212,191,.045),0 12px 26px rgba(0,0,0,.12),0 0 24px rgba(45,212,191,.045)}
    body[data-theme="network"] .credit-text{color:rgba(210,255,247,.48);text-shadow:0 1px 8px rgba(45,212,191,.10),0 -1px 0 rgba(255,255,255,.035)}

    input,textarea,select,button{position:relative;z-index:1}input,textarea,select{color:white;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(var(--accent),.9)!important;box-shadow:0 0 0 3px rgba(var(--accent),.15)}
    @keyframes creditShine{0%,62%{transform:translateX(0) skewX(-20deg);opacity:.12}78%{opacity:.44}100%{transform:translateX(360%) skewX(-20deg);opacity:.03}}
    @keyframes sweep{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
    @keyframes float{50%{transform:translate3d(28px,-18px,80px) scale(1.08)}}@keyframes planet{50%{transform:translate3d(-18px,22px,50px) rotate(5deg)}}@keyframes ring{to{transform:rotate(-18deg) rotateX(68deg) rotateZ(360deg)}}@keyframes grid{to{background-position:0 72px,72px 0}}@keyframes shoot{0%,72%{opacity:0;transform:translate3d(0,0,0) rotate(-28deg)}76%{opacity:1}88%,100%{opacity:0;transform:translate3d(360px,180px,0) rotate(-28deg)}}@keyframes hub{50%{transform:translate3d(-10px,18px,42px) rotateX(3deg) rotateY(-4deg)}}@keyframes pulse{0%{opacity:.1;transform:scale(.76)}55%{opacity:.4}100%{opacity:0;transform:scale(1.16)}}@keyframes stream{0%{opacity:0;transform:translateX(-32px)}12%,80%{opacity:.66}100%{opacity:0;transform:translateX(32px)}}@keyframes node{50%{transform:translate3d(12px,-10px,16px) scale(1.12)}}
    @media(max-width:768px){body{padding:1rem}.planet{width:150px;height:150px;right:-20px;top:70px}.ring{width:220px;height:64px;right:-58px;top:118px}.hub-main{width:128px;height:128px;right:-10px;top:110px}.hub-side{width:88px;height:88px}.r1{width:180px;height:180px;right:-40px;top:84px}.r2{width:250px;height:250px;right:-75px;top:48px}.theme-switcher{width:100%;justify-content:center}.credit-glass{min-width:210px;padding:.72rem 1rem}.credit-text{font-size:.76rem}}
  </style>
</head>
<body class="text-white min-h-screen p-6" data-theme="space">
  <div class="space-bg">
    <canvas id="bgCanvas"></canvas>
    <div class="scene space-scene"><div class="nebula nbl1"></div><div class="nebula nbl2"></div><div class="planet"></div><div class="ring"></div><div class="grid3d"></div><div class="shoot s1"></div><div class="shoot s2"></div></div>
    <div class="scene network-scene"><div class="network-grid"></div><div class="network-hub hub-main"></div><div class="network-hub hub-side"></div><div class="signal-ring r1"></div><div class="signal-ring r2"></div><div class="signal-ring r3"></div><div class="data-stream st1"></div><div class="data-stream st2"></div><div class="data-stream st3"></div><div class="floating-node fn1"></div><div class="floating-node fn2"></div><div class="floating-node fn3"></div><div class="floating-node fn4"></div><div class="floating-node fn5"></div></div>
  </div>
  <div class="app-shell max-w-7xl mx-auto space-y-6">
    <div class="glass-panel rounded-3xl p-8 shadow-2xl">
      <div class="flex flex-wrap justify-between items-center gap-4">
        <div>
          <div id="themeBadge" class="theme-badge mb-3"><i class="fas fa-satellite"></i> Space 3D Interface • v3.3</div>
          <h1 class="text-4xl md:text-5xl font-black tracking-tight">🌐 DHCP Automation PRO</h1>
          <div id="themeDescription" class="credit-wrap"></div>
        </div>
        <div class="flex flex-col items-end gap-3">
          <div class="theme-switcher"><button id="themeSpaceBtn" class="theme-btn active" onclick="setTheme('space')"><i class="fas fa-star"></i> Space</button><button id="themeNetworkBtn" class="theme-btn" onclick="setTheme('network')"><i class="fas fa-network-wired"></i> Network</button></div>
          <div class="flex flex-wrap gap-3"><button onclick="addPool()" class="bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-2xl transition"><i class="fas fa-plus"></i> Add Pool</button><button onclick="autoFillAll()" class="bg-orange-600 hover:bg-orange-500 px-5 py-3 rounded-2xl transition"><i class="fas fa-magic"></i> Auto Fill</button><button onclick="exportCfg()" class="bg-purple-600 hover:bg-purple-500 px-5 py-3 rounded-2xl transition"><i class="fas fa-download"></i> Export CFG</button></div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="glass-panel bg-emerald-950/50 rounded-3xl p-5"><h3 class="font-bold text-emerald-300"><i class="fas fa-shield-halved"></i> Validate ก่อน Generate</h3><p class="text-sm text-emerald-100/80 mt-1">เช็ก MAC 12 หลัก, IP ถูกต้อง และ VLAN 1-4094 อัตโนมัติ</p></div><div class="glass-panel bg-gray-900 rounded-3xl p-5 flex flex-col md:flex-row md:items-center gap-4 lg:col-span-2"><span class="font-bold md:w-32"><i class="fas fa-server"></i> DNS Server:</span><input id="dnsInput" value="10.20.100.2 10.26.100.2" oninput="updateConfig()" class="flex-1 p-3 bg-gray-800/80 border border-gray-700 rounded-2xl font-mono"></div></div>
    <input id="searchInput" placeholder="🔍 Search IP, MAC or Name..." onkeyup="filterPools()" class="w-full p-4 rounded-2xl bg-gray-900/75 border border-gray-700 backdrop-blur-xl">
    <div class="glass-panel bg-gray-900 rounded-3xl p-6"><div class="flex flex-wrap justify-between items-center mb-4 gap-4"><h2 class="text-2xl font-bold"><i class="fas fa-file-import"></i> Mass Pool Import</h2><div class="flex items-center gap-3"><span class="font-bold text-gray-300">Device Name:</span><select id="bulkDeviceName" class="p-2 px-4 rounded-xl bg-gray-800 border border-gray-700"><option value="CCTV">CCTV</option><option value="Computer" selected>Computer</option><option value="Inspector">Inspector</option><option value="Printer">Printer</option><option value="Telepresence">Telepresence</option><option value="Data_Lake">Data_Lake</option><option value="IP_Phone">IP_Phone</option></select></div></div><div class="grid grid-cols-1 md:grid-cols-4 gap-4"><div><p class="mb-2 font-bold">MAC Address</p><textarea id="bulkMac" rows="8" oninput="validateBulkInputs()" class="w-full p-4 rounded-2xl bg-gray-950/85 border border-gray-700 font-mono" placeholder="6c3b.e524.91f8"></textarea></div><div><p class="mb-2 font-bold">IP Address</p><textarea id="bulkIp" rows="8" oninput="validateBulkInputs()" class="w-full p-4 rounded-2xl bg-gray-950/85 border border-gray-700 font-mono" placeholder="10.36.2.134"></textarea></div><div><p class="mb-2 font-bold">Gateway</p><textarea id="bulkGateway" rows="8" oninput="validateBulkInputs()" class="w-full p-4 rounded-2xl bg-gray-950/85 border border-gray-700 font-mono" placeholder="10.36.2.1"></textarea></div><div><p class="mb-2 font-bold">VLAN</p><textarea id="bulkVlan" rows="8" oninput="validateBulkInputs()" class="w-full p-4 rounded-2xl bg-gray-950/85 border border-gray-700 font-mono" placeholder="2"></textarea></div></div><div id="bulkValidationBox" class="mt-4 hidden rounded-2xl border p-4 text-sm"></div><button id="bulkGenerateBtn" onclick="bulkImport()" class="mt-4 bg-cyan-600 hover:bg-cyan-500 px-6 py-3 rounded-2xl font-medium disabled:bg-gray-700 disabled:text-gray-400 disabled:cursor-not-allowed transition"><i class="fas fa-bolt"></i> Generate & Add Pools</button></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6"><div id="poolsContainer" class="space-y-4"></div><div class="glass-panel bg-black/80 border border-gray-800 rounded-3xl overflow-hidden"><div class="flex justify-between items-center p-5 border-b border-gray-700"><h2 class="font-bold"><i class="fas fa-terminal"></i> Cisco Configuration Output</h2><button onclick="copyAllConfig()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-2xl transition">📋 Copy All</button></div><div class="p-4 border-b border-gray-700 bg-gray-950/80 flex flex-wrap items-center gap-6"><label class="text-sm font-medium"><input type="checkbox" id="includeUpdateArp" checked onchange="updateConfig()" class="accent-blue-500"> รวม update arp</label><label class="text-sm font-medium"><input type="checkbox" id="includeSourceBinding" checked onchange="updateConfig()" class="accent-blue-500"> รวม ip source binding</label></div><pre id="configOutput" class="terminal text-green-400 p-6 text-sm overflow-auto min-h-[600px] whitespace-pre-wrap bg-gray-950/90"></pre><div id="message" class="text-center py-3 text-emerald-400 text-sm"></div></div></div>
  </div>
  <script>
    let pools=[],activeTheme='space',bgCanvas,bgCtx,bgEntities=[],bgMouse={x:innerWidth/2,y:innerHeight/2},reduceMotion=false;
    function creditMarkup(){return `<div class="credit-glass"><span class="layer one"></span><span class="layer two"></span><span class="credit-text">Developed by Aidsares Veangin</span></div>`}
    function init(){pools=[];renderPools();validateBulkInputs();updateConfig()}
    function cleanMac(mac){return String(mac||'').replace(/[^a-fA-F0-9]/g,'').toLowerCase().replace(/^01/,'')}function isValidMac(mac){return cleanMac(mac).length===12}function formatMac(v){const c=cleanMac(v).slice(0,12);return c?(c.match(/.{1,4}/g)?.join('.')||c):''}function getMacClean12(mac){return cleanMac(mac).slice(0,12)}function formatClientIdentifierMac(mac){const c=getMacClean12(mac);return c.length!==12?'':((`01${c}`).match(/.{1,4}/g)?.join('.')||'')}function formatSourceBindingMac(mac){const c=getMacClean12(mac);return c.length!==12?'':(c.match(/.{1,4}/g)?.join('.')||'')}function isValidIP(ip){return /^(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}$/.test(String(ip||'').trim())}function isValidVlan(vlan){const v=String(vlan||'').trim();if(!/^\d+$/.test(v))return false;const n=Number(v);return n>=1&&n<=4094}
    function getPoolStatus(p){const s={isMacValid:isValidMac(p.mac),isIpValid:isValidIP(p.ip),isGwValid:isValidIP(p.gateway),isVlanValid:isValidVlan(p.vlan)};s.isValid=s.isMacValid&&s.isIpValid&&s.isGwValid&&s.isVlanValid;return s}function statusLine(ok,text){return`<div class="flex items-center gap-2 ${ok?'text-emerald-400':'text-red-400'}"><i class="fas ${ok?'fa-circle-check':'fa-triangle-exclamation'}"></i><span>${text}</span></div>`}function poolHelp(s){return`<div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">${statusLine(s.isMacValid,s.isMacValid?'MAC ถูกต้อง 12 หลัก':'MAC ต้องมี 12 หลัก เช่น 6c3b.e524.91f8')}${statusLine(s.isIpValid,s.isIpValid?'IP ถูกต้อง':'IP ไม่ถูกต้อง เช่น 10.36.2.134')}${statusLine(s.isGwValid,s.isGwValid?'Gateway ถูกต้อง':'Gateway ไม่ถูกต้อง')}${statusLine(s.isVlanValid,s.isVlanValid?'VLAN ถูกต้อง':'VLAN ต้องเป็นเลข 1-4094')}</div>`}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
    function renderPools(){const c=document.getElementById('poolsContainer');let html='';pools.forEach((p,i)=>{const s=getPoolStatus(p);html+=`<div class="pool-card bg-gray-900 rounded-3xl p-6 border ${s.isValid?'border-green-500/40':'border-red-500/40'}"><div class="flex justify-between items-start mb-4"><div class="flex items-center gap-3"><span class="text-2xl">${s.isValid?'✅':'⚠️'}</span><div><h3 class="text-xl font-bold">Pool #${i+1}</h3><span class="text-xs px-3 py-1 rounded-full ${s.isValid?'bg-green-500/20 text-green-400':'bg-red-500/20 text-red-400'}">${s.isValid?'พร้อม Generate / Copy':'ต้องแก้ข้อมูลก่อน Generate'}</span></div></div><div class="flex gap-4"><button onclick="copySingle(${p.id})" class="${s.isValid?'text-blue-400 hover:text-blue-300':'text-gray-600 cursor-not-allowed'}"><i class="fas fa-copy"></i></button><button onclick="removePool(${p.id})" class="text-red-500 hover:text-red-600"><i class="fas fa-trash"></i></button></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><input value="${esc(p.name)}" placeholder="Device Name" oninput="updateField(${p.id},'name',this.value)" class="p-3 bg-gray-800/80 border border-gray-700 rounded-2xl"><input value="${esc(p.mac)}" placeholder="MAC Address" oninput="updateField(${p.id},'macRaw',this.value)" onblur="updateField(${p.id},'mac',this.value)" class="p-3 bg-gray-800/80 border ${s.isMacValid?'border-gray-700':'border-red-500'} rounded-2xl font-mono"><input value="${esc(p.ip)}" placeholder="IP Address" oninput="updateField(${p.id},'ip',this.value)" class="p-3 bg-gray-800/80 border ${s.isIpValid?'border-gray-700':'border-red-500'} rounded-2xl font-mono"><input value="${esc(p.gateway)}" placeholder="Gateway" oninput="updateField(${p.id},'gateway',this.value)" class="p-3 bg-gray-800/80 border ${s.isGwValid?'border-gray-700':'border-red-500'} rounded-2xl font-mono"><input value="${esc(p.subnet)}" placeholder="Subnet" oninput="updateField(${p.id},'subnet',this.value)" class="p-3 bg-gray-800/80 border border-gray-700 rounded-2xl font-mono"><input value="${esc(p.vlan)}" placeholder="VLAN" oninput="updateField(${p.id},'vlan',this.value)" class="p-3 bg-gray-800/80 border ${s.isVlanValid?'border-gray-700':'border-red-500'} rounded-2xl font-mono"><input value="${esc(p.interfaceName)}" placeholder="Interface (PO1)" oninput="updateField(${p.id},'interfaceName',this.value)" class="p-3 bg-gray-800/80 border border-gray-700 rounded-2xl md:col-span-2 font-mono"></div>${poolHelp(s)}</div>`});c.innerHTML=html||'<div class="glass-panel bg-gray-900 rounded-3xl p-8 text-center text-gray-400 border border-gray-800">กด Add Pool หรือใส่ข้อมูลใน Mass Pool Import เพื่อเริ่ม Generate</div>'}
    function updateField(id,field,value){pools=pools.map(p=>{if(p.id!==id)return p;if(field==='mac')return{...p,mac:formatMac(value)};if(field==='macRaw')return{...p,mac:value};return{...p,[field]:value}});renderPools();updateConfig()}function addPool(){pools.push({id:Date.now(),name:document.getElementById('bulkDeviceName')?.value||'Computer',mac:'',ip:'',subnet:'255.255.255.0',gateway:pools.length?pools[pools.length-1].gateway:'10.36.2.1',vlan:pools.length?pools[pools.length-1].vlan:'2',interfaceName:pools.length?pools[pools.length-1].interfaceName:'PO1'});renderPools();updateConfig()}function removePool(id){pools=pools.filter(p=>p.id!==id);renderPools();updateConfig()}
    function autoFillAll(){if(!pools.length)return showMessage('ยังไม่มี Pool ให้ Auto Fill');const f=pools[0],s=f.ip.split('.');let prefix='',start=0;if(s.length===4){prefix=`${s[0]}.${s[1]}.${s[2]}`;start=Number(s[3])}pools=pools.map((p,i)=>({...p,gateway:f.gateway||p.gateway,vlan:f.vlan||p.vlan,subnet:f.subnet||p.subnet,interfaceName:f.interfaceName||p.interfaceName,ip:prefix&&Number.isFinite(start)?`${prefix}.${start+i}`:p.ip}));renderPools();updateConfig();showMessage('Auto Fill สำเร็จ ✅')}function getLines(id){const e=document.getElementById(id);return e?e.value.trim().split('\n').map(l=>l.trim()).filter(Boolean):[]}
    function validateBulkInputs(){const mac=getLines('bulkMac'),ip=getLines('bulkIp'),gw=getLines('bulkGateway'),vlan=getLines('bulkVlan'),box=document.getElementById('bulkValidationBox'),btn=document.getElementById('bulkGenerateBtn');if(!box||!btn)return true;const msg=[];if(!(mac.length||ip.length||gw.length||vlan.length)){box.className='mt-4 hidden rounded-2xl border p-4 text-sm';btn.disabled=false;return true}if(!mac.length)msg.push('ต้องกรอก MAC Address อย่างน้อย 1 บรรทัด');if(!ip.length)msg.push('ต้องกรอก IP Address อย่างน้อย 1 บรรทัด');if(mac.length&&ip.length&&mac.length!==ip.length)msg.push(`จำนวน MAC (${mac.length}) และ IP (${ip.length}) ต้องเท่ากัน`);mac.forEach((m,i)=>{if(!isValidMac(m))msg.push(`MAC บรรทัด ${i+1} ไม่ถูกต้อง: ${m}`)});ip.forEach((v,i)=>{if(!isValidIP(v))msg.push(`IP บรรทัด ${i+1} ไม่ถูกต้อง: ${v}`)});gw.forEach((v,i)=>{if(!isValidIP(v))msg.push(`Gateway บรรทัด ${i+1} ไม่ถูกต้อง: ${v}`)});vlan.forEach((v,i)=>{if(!isValidVlan(v))msg.push(`VLAN บรรทัด ${i+1} ต้องเป็นเลข 1-4094: ${v}`)});const ok=!msg.length;box.className=`mt-4 rounded-2xl border p-4 text-sm ${ok?'border-emerald-500/40 bg-emerald-950/40 text-emerald-200':'border-red-500/40 bg-red-950/40 text-red-200'}`;box.innerHTML=ok?'<div class="flex items-center gap-2"><i class="fas fa-circle-check"></i><strong>ข้อมูลถูกต้อง พร้อม Generate</strong></div>':`<div class="font-bold mb-2"><i class="fas fa-triangle-exclamation"></i> พบข้อมูลไม่ถูกต้อง กรุณาแก้ก่อน Generate</div><ul class="list-disc pl-6 space-y-1">${msg.map(m=>`<li>${m}</li>`).join('')}</ul>`;btn.disabled=!ok;return ok}
    function bulkImport(){if(!validateBulkInputs()){alert('⚠️ พบข้อมูลไม่ถูกต้อง กรุณาแก้ MAC / IP / VLAN ก่อนกด Generate');return showMessage('พบข้อมูลไม่ถูกต้อง')}const mac=getLines('bulkMac'),ip=getLines('bulkIp'),gw=getLines('bulkGateway'),vlan=getLines('bulkVlan');if(!mac.length||!ip.length){alert('⚠️ กรุณากรอก MAC Address และ IP Address ก่อนกด Generate');return}const defGw=gw[0]||'10.36.2.1',defVlan=vlan[0]||'2',name=document.getElementById('bulkDeviceName')?.value||'Computer';pools=mac.map((m,i)=>({id:Date.now()+i,name,mac:formatMac(m),ip:ip[i]||'',subnet:'255.255.255.0',gateway:gw[i]||defGw,vlan:vlan[i]||defVlan,interfaceName:'PO1'}));['bulkMac','bulkIp','bulkGateway','bulkVlan'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});renderPools();updateConfig();validateBulkInputs();showMessage(`สร้างใหม่ ${pools.length} Pools สำเร็จ ✅`)}
    function filterPools(){const term=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.pool-card').forEach((card,i)=>{const p=pools[i];if(!p)return;card.style.display=`${p.ip} ${p.mac} ${p.name}`.toLowerCase().includes(term)?'block':'none'})}
    function generateConfig(){if(!pools.length)return'ยังไม่มี Pool';const bad=pools.map((p,i)=>({i:i+1,s:getPoolStatus(p)})).filter(x=>!x.s.isValid);if(bad.length)return`พบข้อมูลไม่ถูกต้องใน Pool #${bad.map(x=>x.i).join(', ')}\nกรุณาแก้ MAC / IP / Gateway / VLAN ก่อน Generate`;const dns=document.getElementById('dnsInput')?.value.trim()||'10.20.100.2 10.26.100.2',includeBinding=document.getElementById('includeSourceBinding')?.checked??true,includeArp=document.getElementById('includeUpdateArp')?.checked??false;return pools.map(p=>{const cid=formatClientIdentifierMac(p.mac),sb=formatSourceBindingMac(p.mac),cfg=[`ip dhcp pool ${p.ip}_${p.name}`,` host ${p.ip} ${p.subnet}`,` client-identifier ${cid}`,` default-router ${p.gateway}`,` dns-server ${dns}`];if(includeArp)cfg.push('',' update arp');if(includeBinding)cfg.push('',` ip source binding ${sb} vlan ${p.vlan} ${p.ip} interface ${p.interfaceName}`);return cfg.join('\n')}).join('\n\n!\n\n')}function updateConfig(){const o=document.getElementById('configOutput');if(o)o.textContent=generateConfig()}async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return true}}async function copySingle(id){const p=pools.find(x=>x.id===id);if(!p)return;if(!getPoolStatus(p).isValid){alert('ข้อมูล Pool ไม่ถูกต้อง ไม่สามารถ Copy ได้');return}const old=pools;pools=[p];const cfg=generateConfig();pools=old;if(await copyText(cfg))showMessage('✅ Copy Pool สำเร็จ')}async function copyAllConfig(){const cfg=generateConfig();if(cfg.includes('พบข้อมูลไม่ถูกต้อง')||cfg==='ยังไม่มี Pool'){alert('ยังไม่มี Config ที่สมบูรณ์ ให้แก้ข้อมูลก่อน');return}if(await copyText(cfg))showMessage('✅ Copy All สำเร็จ')}function exportCfg(){const cfg=generateConfig();if(cfg.includes('พบข้อมูลไม่ถูกต้อง')||cfg==='ยังไม่มี Pool'){alert('ไม่มี Config ให้ Export กรุณาแก้ข้อมูลก่อน');return}const blob=new Blob([cfg],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`dhcp_config_${Date.now()}.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function showMessage(text){const m=document.getElementById('message');if(!m)return;m.textContent=text;setTimeout(()=>m.textContent='',2500)}
    function applyThemeText(){const badge=document.getElementById('themeBadge'),desc=document.getElementById('themeDescription');document.getElementById('themeSpaceBtn').classList.toggle('active',activeTheme==='space');document.getElementById('themeNetworkBtn').classList.toggle('active',activeTheme==='network');desc.innerHTML=creditMarkup();badge.innerHTML=activeTheme==='network'?'<i class="fas fa-network-wired"></i> Network 3D Interface • v3.3':'<i class="fas fa-satellite"></i> Space 3D Interface • v3.3'}function setTheme(theme){activeTheme=theme==='network'?'network':'space';document.body.dataset.theme=activeTheme;localStorage.setItem('dhcpTheme',activeTheme);applyThemeText();createBackgroundEntities()}
    function initBackground(){bgCanvas=document.getElementById('bgCanvas');if(!bgCanvas)return;bgCtx=bgCanvas.getContext('2d');reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;addEventListener('resize',resizeBackground);addEventListener('mousemove',e=>{bgMouse={x:e.clientX,y:e.clientY};const mx=(e.clientX/innerWidth-.5)*32,my=(e.clientY/innerHeight-.5)*32;document.querySelectorAll('.planet,.ring,.network-hub').forEach((el,i)=>{const d=(i+1)*.14;el.style.translate=`${mx*d}px ${my*d}px`})});resizeBackground();requestAnimationFrame(drawBackground)}function resizeBackground(){const dpr=Math.min(devicePixelRatio||1,2);bgCanvas.width=Math.floor(innerWidth*dpr);bgCanvas.height=Math.floor(innerHeight*dpr);bgCanvas.style.width=innerWidth+'px';bgCanvas.style.height=innerHeight+'px';bgCtx.setTransform(dpr,0,0,dpr,0,0);createBackgroundEntities()}function createBackgroundEntities(){if(!bgCanvas)return;if(activeTheme==='network'){const count=innerWidth<768?34:58;bgEntities=Array.from({length:count},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*.9+.4,r:Math.random()*3+2,dx:(Math.random()-.5)*.18,dy:(Math.random()-.5)*.18,p:Math.random()*Math.PI*2}))}else{const count=innerWidth<768?90:170;bgEntities=Array.from({length:count},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*1+.25,r:Math.random()*1.8+.25,dx:(Math.random()-.5)*.12,dy:(Math.random()-.5)*.12,a:Math.random()*.65+.18,t:Math.random()*Math.PI*2}))}}
    function drawSpace(){const c=bgCtx;c.clearRect(0,0,innerWidth,innerHeight);const px=(bgMouse.x-innerWidth/2)*.018,py=(bgMouse.y-innerHeight/2)*.018;bgEntities.forEach((s,i)=>{if(!reduceMotion){s.x+=s.dx*s.z;s.y+=s.dy*s.z;s.t+=.018}if(s.x<0)s.x=innerWidth;if(s.x>innerWidth)s.x=0;if(s.y<0)s.y=innerHeight;if(s.y>innerHeight)s.y=0;const x=s.x+px*s.z,y=s.y+py*s.z,alpha=s.a+Math.sin(s.t)*.18;c.beginPath();c.arc(x,y,s.r*s.z,0,Math.PI*2);c.fillStyle=`rgba(226,232,240,${Math.max(.08,alpha)})`;c.fill();for(let j=i+1;j<bgEntities.length;j++){const s2=bgEntities[j];if(Math.abs(s.x-s2.x)>92||Math.abs(s.y-s2.y)>92)continue;const dist=Math.hypot(s.x-s2.x,s.y-s2.y);if(dist<92&&s.z>.78&&s2.z>.78){c.beginPath();c.moveTo(x,y);c.lineTo(s2.x+px*s2.z,s2.y+py*s2.z);c.strokeStyle=`rgba(56,189,248,${.10-dist/920})`;c.lineWidth=.7;c.stroke()}}})}
    function drawNetwork(){const c=bgCtx;c.clearRect(0,0,innerWidth,innerHeight);const px=(bgMouse.x-innerWidth/2)*.012,py=(bgMouse.y-innerHeight/2)*.012;bgEntities.forEach((n,i)=>{if(!reduceMotion){n.x+=n.dx*n.z;n.y+=n.dy*n.z;n.p+=.028}if(n.x<0)n.x=innerWidth;if(n.x>innerWidth)n.x=0;if(n.y<0)n.y=innerHeight;if(n.y>innerHeight)n.y=0;const x=n.x+px*n.z,y=n.y+py*n.z,glow=.55+Math.sin(n.p)*.2;c.beginPath();c.arc(x,y,n.r*n.z,0,Math.PI*2);c.fillStyle=`rgba(125,211,252,${glow})`;c.fill();c.beginPath();c.arc(x,y,(n.r+4)*n.z,0,Math.PI*2);c.strokeStyle=`rgba(45,212,191,${.12+Math.sin(n.p)*.05})`;c.lineWidth=1;c.stroke();for(let j=i+1;j<bgEntities.length;j++){const n2=bgEntities[j],dist=Math.hypot(n.x-n2.x,n.y-n2.y);if(dist<190){c.beginPath();c.moveTo(x,y);c.lineTo(n2.x+px*n2.z,n2.y+py*n2.z);c.strokeStyle=`rgba(34,211,238,${.16-dist/1300})`;c.lineWidth=.9;c.stroke();const t=((Date.now()/1000)+(i+j)*.1)%1,dx=n2.x+px*n2.z,dy=n2.y+py*n2.z;c.beginPath();c.arc(x+(dx-x)*t,y+(dy-y)*t,1.9,0,Math.PI*2);c.fillStyle='rgba(255,255,255,.85)';c.fill()}}})}
    function drawBackground(){if(!bgCtx)return;activeTheme==='network'?drawNetwork():drawSpace();requestAnimationFrame(drawBackground)}window.onload=()=>{init();initBackground();setTheme(localStorage.getItem('dhcpTheme')==='network'?'network':'space')}

    element.id = element.dataset.refId;

  window.fillDemoRows = () => {
    const data = [
      ["00:11:22:33:44:55", "192.168.10.10", "192.168.10.1", "10"],
      ["00:11:22:33:44:56", "192.168.10.20", "192.168.10.1", "10"],
      ["00:11:22:33:44:57", "192.168.20.10", "192.168.20.1", "20"],
      ["00:11:22:33:44:58", "192.168.20.20", "192.168.20.1", "20"],
      ["00:11:22:33:44:59", "192.168.30.10", "192.168.30.1", "30"],
      ["00:11:22:33:44:60", "192.168.30.20", "192.168.30.1", "30"]
    ];
    ["bulkMac","bulkIp","bulkGateway","bulkVlan"].forEach((id, idx) => {
      const el = document.getElementById(id);
      if (el) el.value = data.map(row => row[idx]).join("\n");

  function lines(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim().split("\n").map(v => v.trim()).filter(Boolean) : [];
  }

  window.refreshWorkspace = function refreshWorkspace() {
    const mac = lines("bulkMac");
    const ip = lines("bulkIp");
    const gw = lines("bulkGateway");
    const vlan = lines("bulkVlan");
    const rows = Math.max(mac.length, ip.length, pools?.length || 0);
    const vlanSet = new Set([...(pools || []).map(p => p.vlan), ...vlan].filter(Boolean));
    const subnetSet = new Set([...(pools || []).map(p => String(p.gateway || "").split(".").slice(0, 3).join(".")), ...gw.map(v => v.split(".").slice(0, 3).join("."))].filter(Boolean));
    const checks = [
      ["MAC format valid", "รูปแบบ MAC ถูกต้อง", mac.length ? mac.every(isValidMac) : !(pools || []).some(p => !isValidMac(p.mac))],
      ["IP in subnet", "IP อยู่ในเครือข่าย", ip.length ? ip.every(isValidIP) : !(pools || []).some(p => !isValidIP(p.ip))],
      ["VLAN 1-4094", "ช่วง VLAN ถูกต้อง", vlan.length ? vlan.every(isValidVlan) : !(pools || []).some(p => !isValidVlan(p.vlan))],
      ["Gateway matched", "Gateway ตรงกับ Subnet", gw.length ? gw.every(isValidIP) : !(pools || []).some(p => !isValidIP(p.gateway))],
      ["DNS reachable (optional)", "ตรวจสอบ DNS", true]
    ];
    const list = document.getElementById("validationList");
    if (list) {
      list.innerHTML = checks.map(([title, note, ok]) => `
        <div class="check-row"><i class="fas ${ok ? "fa-circle-check" : "fa-triangle-exclamation"}"></i><div><b>${title}</b><span>${note}</span></div><span class="valid-tag">${ok ? "Valid" : "Check"}</span></div>
      `).join("");
    }
    const poolCount = pools?.length || rows || 0;
    const ipCount = pools?.length || ip.length || 0;
    const util = ipCount ? Math.min(100, Math.round((poolCount / Math.max(ipCount, poolCount)) * 100)) : 0;
    const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    setText("wsPools", poolCount);
    setText("wsIps", ipCount);
    setText("wsVlans", vlanSet.size || 0);
    setText("wsSubnets", subnetSet.size || 0);
    setText("statPools", poolCount);
    setText("statIps", ipCount);
    setText("statUtil", `${util}%`);
    setText("statUtilNote", `${poolCount} / ${Math.max(ipCount, poolCount)} used`);
    setText("lastSync", new Date().toLocaleString("th-TH"));
    const cfg = document.getElementById("configOutput")?.textContent || "";
    setText("configMeta", `Lines: ${cfg ? cfg.split("\n").length : 0} | Pools: ${pools?.length || 0}`);
  };

  const oldUpdateConfig = window.updateConfig;
  if (typeof oldUpdateConfig === "function") {
    window.updateConfig = function patchedUpdateConfig() {
      oldUpdateConfig();
      refreshWorkspace();
    };
  }
  const oldValidate = window.validateBulkInputs;
  if (typeof oldValidate === "function") {
    window.validateBulkInputs = function patchedValidateBulkInputs() {
      const result = oldValidate();
      refreshWorkspace();
      return result;
    };
  }

  function lockReferenceHeader() {
    document.body.dataset.theme = "network";
    const badge = document.getElementById("themeBadge");
    if (badge) badge.innerHTML = '<i class="fas fa-circle-check"></i> All services operational';
  }
  addEventListener("load", () => {
    setTimeout(() => {
      lockReferenceHeader();
      refreshWorkspace();
    }, 0);
  }, { once: true });
})();
</script>
</body>
</html>
