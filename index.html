<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Log Generator - CyberGlass Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    @keyframes blob {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .animate-blob { animation: blob 8s infinite alternate ease-in-out; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    .glass-input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.3s ease;
    }

    .glass-input:focus {
      background: rgba(0, 0, 0, 0.4);
      border-color: rgba(34, 211, 238, 0.6);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
      outline: none;
    }

    ::placeholder { color: rgba(255, 255, 255, 0.3) !important; }
    datalist { color: #000; }

    @media (prefers-reduced-motion: reduce) {
      .animate-blob { animation: none !important; }
    }
  </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 lg:p-8">
  <!-- Background Effects -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-600/40 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-600/40 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-[-10%] left-[20%] w-[500px] h-[500px] bg-blue-600/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-4000"></div>
  </div>

  <!-- Main App -->
  <main class="relative z-10 w-full max-w-3xl glass-panel p-6 md:p-8 rounded-2xl">
    <div class="flex items-center gap-3 mb-8 border-b border-white/10 pb-4">
      <div class="w-3 h-8 bg-cyan-400 rounded-full shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
      <h1 class="text-2xl font-semibold tracking-wide text-white">SYSTEM LOG GENERATOR</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
      <div class="col-span-1 md:col-span-2 relative group">
        <label class="block text-xs font-medium text-cyan-300 mb-1 uppercase tracking-wider" for="timeInput">Time (เวลา) - Auto (-15 Mins)</label>
        <div class="flex gap-2">
          <input type="text" id="timeInput" value="00" placeholder="เช่น 10:25" class="w-full glass-input rounded-xl px-4 py-3" onblur="autoCalculateTime()">
          <button type="button" onclick="document.getElementById('timeInput').value='00'" class="bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 px-5 py-3 rounded-xl whitespace-nowrap transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,211,238,0.4)] font-bold">00</button>
        </div>
      </div>

      <div class="relative group">
        <label class="block text-xs font-medium text-cyan-300 mb-1 uppercase tracking-wider" for="srcIp">Source IP (ต้นทาง)</label>
        <input type="text" id="srcIp" placeholder="e.g. 10.20.2.16" class="w-full glass-input rounded-xl px-4 py-3">
      </div>

      <div class="relative group">
        <label class="block text-xs font-medium text-cyan-300 mb-1 uppercase tracking-wider" for="dstIp">Destination IP (ปลายทาง)</label>
        <input type="text" id="dstIp" placeholder="e.g. 10.109.1.16" class="w-full glass-input rounded-xl px-4 py-3" onblur="fetchISPData()">
      </div>

      <div class="col-span-1 md:col-span-2 relative">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-1">
          <label class="block text-xs font-medium text-cyan-300 uppercase tracking-wider" for="ispInput">Network / ISP (ผู้ให้บริการ)</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="showCountryToggle" class="sr-only peer" onchange="renderISP()" checked>
            <div class="w-9 h-5 bg-black/40 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-cyan-400 after:border-cyan-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500/50 border border-cyan-500/30"></div>
            <span class="ml-2 text-xs font-medium text-cyan-200 uppercase tracking-wider">+ Country (Full)</span>
          </label>
        </div>

        <div class="flex gap-3">
          <input type="text" id="ispInput" list="isp-list" placeholder="Auto-fetch data..." class="w-full glass-input rounded-xl px-4 py-3">
          <datalist id="isp-list">
            <option value="PRIVATE"></option>
            <option value="TRUE, Thailand"></option>
            <option value="AIS, Thailand"></option>
            <option value="3BB, Thailand"></option>
            <option value="NT, Thailand"></option>
          </datalist>
          <button type="button" onclick="fetchISPData()" class="bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 px-5 py-3 rounded-xl whitespace-nowrap transition-all duration-300 flex items-center gap-2 hover:shadow-[0_0_15px_rgba(34,211,238,0.4)]">
            <span>SCAN IP</span>
          </button>
        </div>
      </div>
    </div>

    <button type="button" onclick="generateLogs()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 rounded-xl mb-8 transition-all duration-300 shadow-[0_0_20px_rgba(34,211,238,0.4)] hover:shadow-[0_0_30px_rgba(34,211,238,0.7)] transform hover:-translate-y-1">
      GENERATE LOGS
    </button>

    <div class="space-y-6">
      <section class="glass-panel p-4 rounded-xl">
        <div class="flex justify-between items-center mb-3">
          <label class="block text-sm font-semibold text-cyan-200" for="result1">FORMAT 1: Full IP</label>
          <button type="button" onclick="copyText('result1', this)" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded text-xs font-medium transition-colors">COPY</button>
        </div>
        <textarea id="result1" rows="3" class="w-full glass-input rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea>
      </section>

      <section class="glass-panel p-4 rounded-xl">
        <div class="flex justify-between items-center mb-3">
          <label class="block text-sm font-semibold text-cyan-200" for="result2">FORMAT 2: Masked IP (xx)</label>
          <button type="button" onclick="copyText('result2', this)" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded text-xs font-medium transition-colors">COPY</button>
        </div>
        <textarea id="result2" rows="3" class="w-full glass-input rounded-lg px-4 py-3 font-mono text-sm resize-none" readonly></textarea>
      </section>
    </div>
  </main>

  <script>
    let fetchedISP = '';
    let fetchedCountry = '';

    function formatIspName(rawName) {
      if (!rawName) return '';
      const upper = rawName.toUpperCase();
      if (upper.includes('TRUE') || upper.includes('REAL FUTURE')) return 'TRUE';
      if (upper.includes('AIS') || upper.includes('ADVANCED WIRELESS') || upper.includes('AWN')) return 'AIS';
      if (upper.includes('3BB') || upper.includes('TRIPLE T')) return '3BB';
      if (upper.includes('NT') || upper.includes('NATIONAL TELECOM') || upper.includes('CAT') || upper.includes('TOT')) return 'NT';
      if (upper.includes('DTAC') || upper.includes('TOTAL ACCESS')) return 'DTAC';
      return rawName.replace(/^AS\d+\s+/, '');
    }

    function autoCalculateTime() {
      const timeEl = document.getElementById('timeInput');
      const value = timeEl.value.trim();
      const match = value.match(/^(\d{1,2})[:.](\d{2})$/);
      if (!match) return;

      let hours = Number(match[1]);
      let minutes = Number(match[2]);
      if (hours > 23 || minutes > 59) return;

      minutes -= 15;
      if (minutes < 0) {
        minutes += 60;
        hours -= 1;
      }
      if (hours < 0) hours += 24;
      timeEl.value = `${String(hours).padStart(2, '0')}.${String(minutes).padStart(2, '0')}`;
    }

    function extractIPv4(value) {
      const match = String(value || '').match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/);
      if (!match) return '';
      const parts = match[0].split('.').map(Number);
      return parts.every((part) => part >= 0 && part <= 255) ? match[0] : '';
    }

    function isPrivateIPv4(ip) {
      const parts = ip.split('.').map(Number);
      if (parts.length !== 4 || parts.some(Number.isNaN)) return false;
      if (parts[0] === 10) return true;
      if (parts[0] === 192 && parts[1] === 168) return true;
      return parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31;
    }

    async function fetchJson(url, timeoutMs = 5000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function fetchISPData() {
      const raw = document.getElementById('dstIp').value.trim();
      if (!raw) return;

      const dstIp = extractIPv4(raw);
      if (!dstIp) {
        fetchedISP = 'IP ไม่ถูกต้อง';
        fetchedCountry = '';
        renderISP();
        return;
      }

      if (isPrivateIPv4(dstIp)) {
        fetchedISP = 'PRIVATE';
        fetchedCountry = '';
        renderISP();
        return;
      }

      document.getElementById('ispInput').value = 'SCANNING...';

      try {
        const data = await fetchJson(`https://ipwho.is/${dstIp}`, 5000);
        if (!data.success) throw new Error('Main API failed');
        fetchedISP = formatIspName(data.connection?.isp || data.connection?.org || 'ไม่พบข้อมูล');
        fetchedCountry = data.country || '';
        renderISP();
        return;
      } catch (error) {
        try {
          const data = await fetchJson(`https://ipapi.co/${dstIp}/json/`, 5000);
          if (data.error || !data.org) throw new Error('Fallback API failed');
          fetchedISP = formatIspName(data.org);
          fetchedCountry = data.country_name || '';
          renderISP();
          return;
        } catch (fallbackError) {
          fetchedISP = 'เชื่อมต่อล้มเหลว (Network Blocked)';
          fetchedCountry = '';
          renderISP();
        }
      }
    }

    function renderISP() {
      const showCountry = document.getElementById('showCountryToggle').checked;
      const ispInput = document.getElementById('ispInput');
      if (!fetchedISP) return;
      ispInput.value = showCountry && fetchedCountry ? `${fetchedISP}, ${fetchedCountry}` : fetchedISP;
    }

    function maskIp(ip) {
      const extracted = extractIPv4(ip);
      if (!extracted) return ip || '';
      const parts = extracted.split('.');
      parts[3] = 'xx';
      return parts.join('.');
    }

    function generateLogs() {
      const time = document.getElementById('timeInput').value.trim() || '00';
      const srcIp = document.getElementById('srcIp').value.trim() || '-';
      const dstIp = document.getElementById('dstIp').value.trim() || '-';
      const isp = document.getElementById('ispInput').value.trim() || 'PRIVATE';

      const srcMasked = maskIp(srcIp);
      const dstMasked = maskIp(dstIp);

      const msg1 = `เวลา ${time} น. ตรวจสอบพบต้นทาง IP : ${srcIp} เรียกไปปลายทาง IP : ${dstIp} ( ${isp} )\nไม่ Block การใช้งานเนื่องจากตรวจสอบแล้วเป็นการใช้งานตามปกติ`;
      const msg2 = `เวลา ${time} น. ตรวจสอบพบต้นทาง IP : ${srcMasked} เรียกไปปลายทาง IP : ${dstMasked} ( ${isp} )\nไม่ Block การใช้งานเนื่องจากตรวจสอบแล้วเป็นการใช้งานตามปกติ`;

      document.getElementById('result1').value = msg1;
      document.getElementById('result2').value = msg2;
    }

    async function copyText(elementId, btnElement) {
      const textArea = document.getElementById(elementId);
      const text = textArea.value;
      if (!text) return;

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          textArea.select();
          document.execCommand('copy');
        }
      } catch (error) {
        textArea.select();
        document.execCommand('copy');
      }

      const originalText = btnElement.innerText;
      btnElement.innerText = 'COPIED!';
      btnElement.classList.add('bg-green-500/40', 'text-green-100');
      setTimeout(() => {
        btnElement.innerText = originalText;
        btnElement.classList.remove('bg-green-500/40', 'text-green-100');
      }, 1500);
    }
  </script>
</body>
</html>
